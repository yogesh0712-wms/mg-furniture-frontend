<!doctype html>
<html lang="en">
  <head>
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts (optimized with display=swap) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "MG Furniture",
        "image": "https://www.mgfurniture.in/logo.png",
        "url": "https://www.mgfurniture.in/",
        "telephone": "+91-9694463626",
        "areaServed": {
          "@type": "City",
          "name": "Jaipur"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Jaipur",
          "addressRegion": "Rajasthan",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!-- Basic Meta -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EAEAC9" />

    <title>MG Furniture | Custom Furniture & Contracting Services</title>

    <meta
      name="description"
      content="MG Furniture offers custom wooden furniture, full furnishing solutions, and contracting services crafted for durability and style."
    />

    <meta
      name="keywords"
      content="MG Furniture, custom furniture, wooden furniture, furniture contractor, interior furnishing, modern furniture"
    />

    <meta name="author" content="MG Furniture" />

    <!-- Open Graph -->
    <meta property="og:title" content="MG Furniture" />
    <meta
      property="og:description"
      content="Custom furniture crafted for comfort and durability."
    />
    <meta property="og:image" content="https://www.mgfurniture.in/logo.png" />
    <meta property="og:url" content="https://www.mgfurniture.in" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MG Furniture" />
    <meta
      name="twitter:description"
      content="Premium custom furniture & contracting services."
    />
    <meta name="twitter:image" content="https://www.mgfurniture.in/logo.png" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
